appId: io.github.abhisheksao.cadence
---
- launchApp:
    clearState: true

# Open Breathe mode and start session
- tapOn: "Breathe"
- assertVisible: "Start"
- tapOn: "Start"

# Verify session is running
- assertVisible: "Pause"
- assertVisible:
    id: "breath-pacer"

# Lock device and wait with screen off
- lockDevice
- sleep: 6000
- unlockDevice

# Verify session persisted and is still active after screen was turned off
- assertVisible: "Pause"
- assertVisible:
    id: "breath-pacer"

# Stop session
- tapOn: "Stop"
- assertVisible:
    text: "Stopped"
