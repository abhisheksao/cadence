name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: |
          npm run typecheck
          npm run check:specs
          npm test -- --watchman=false

      - name: Run Expo prebuild
        run: npx expo prebuild -p android --no-install

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Prepare and sign APK
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Signing APK with repository keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            $BUILD_TOOLS/apksigner sign \
              --ks release.keystore \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "${KEY_ALIAS:-cadence}" \
              --key-pass "pass:${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              --out cadence-release.apk \
              "$APK_PATH"
            rm -f release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing keystore configured; publishing standard release APK..."
            cp "$APK_PATH" cadence-release.apk
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate SHA-256 Checksum
        run: |
          sha256sum cadence-release.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cadence-release.apk
            SHA256SUMS.txt
          name: Cadence ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
